<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Register</title>
</head>
<body>
    <h1>Create an account</h1>

    {% if created %}
        <p>
            Account created. Examiner accounts need admin approval
            before dashboard access.
        </p>
    {% endif %}

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">
        <p>
            <label>
                Email
                <input type="email" name="email" required
                       value="{{ values.get('email', '') }}">
            </label>
        </p>

        <p>
            <label>
                Full name
                <input type="text" name="name" maxlength="150"
                       required value="{{ values.get('name', '') }}">
            </label>
        </p>

        <p>
            <label>
                Account type
                <select name="role" required>
                    <option value="">Choose a role</option>
                    <option value="Student"
                        {% if values.get('role') == 'Student' %}
                            selected
                        {% endif %}>
                        Student
                    </option>
                    <option value="Examiner"
                        {% if values.get('role') == 'Examiner' %}
                            selected
                        {% endif %}>
                        Examiner
                    </option>
                </select>
            </label>
        </p>

        <p>
            <label>
                Contact details
                <input type="text" name="contact_details"
                       value="{{ values.get('contact_details', '') }}">
            </label>
        </p>

        <p>
            <label>
                Department (optional, for examiners)
                <input type="text" name="department" maxlength="100"
                       value="{{ values.get('department', '') }}">
            </label>
        </p>

        <p>
            <label>
                Password
                <input type="password" name="password"
                       autocomplete="new-password" required>
            </label>
        </p>

        <p>
            <label>
                Confirm password
                <input type="password" name="confirm_password"
                       autocomplete="new-password" required>
            </label>
        </p>

        <button type="submit">Register</button>
    </form>
    <h2>Log in</h2>

    <form method="post" action="{{ url_for('login') }}">
        <p>
            <label>
                Email
                <input type="email" name="email"
                    autocomplete="username" required>
            </label>
        </p>

        <p>
            <label>
                Password
                <input type="password" name="password"
                    autocomplete="current-password" required>
            </label>
        </p>

        <button type="submit">Log in</button>
    </form>
</body>
</html>
