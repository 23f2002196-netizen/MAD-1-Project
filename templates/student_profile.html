<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student profile</title>
</head>
<body>
    <h1>Student profile</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token }}">

        <p>
            <label for="student_id">Student ID</label>
            <input id="student_id" type="number"
                   value="{{ student['student_id'] }}" readonly>
        </p>

        <p>
            <label for="email">Email</label>
            <input id="email" type="text"
                   value="{{ g.user['email'] }}" readonly>
        </p>

        <p>
            <label for="role">Role</label>
            <input id="role" type="text"
                   value="{{ g.user['role'] }}" readonly>
        </p>

        <p>
            <label for="status">Status</label>
            <input id="status" type="text"
                   value="{{ student['status'] or '' }}" readonly>
        </p>

        <p>
            <label for="name">Name</label>
            <input id="name" name="name" type="text"
                   maxlength="150" required
                   value="{{ values['name'] }}">
        </p>

        <p>
            <label for="contact_details">Phone / contact details</label>
            <input id="contact_details" name="contact_details"
                   type="text"
                   value="{{ values['contact_details'] }}">
        </p>

        <button type="submit" name="action" value="update">
            Update
        </button>

        <button type="submit" name="action" value="cancel"
                formnovalidate>
            Cancel
        </button>
    </form>
</body>
</html>
