<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Course</title>
</head>
<body>
    <h1>
        {% if delete_mode %}
            Delete course
        {% elif course_id is not none %}
            Edit course
        {% else %}
            Add course
        {% endif %}
    </h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    {% if delete_mode %}
        <p>Confirm deletion of this course.</p>
    {% endif %}

    <form method="post">
        <p>
            <label>
                Course code
                <input name="course_code" type="number"
                       min="1000" max="9999" step="1" required
                       value="{{ values['course_code'] }}"
                       {% if delete_mode %}disabled{% endif %}>
            </label>
        </p>

        <p>
            <label>
                Name
                <input name="course_name" type="text" required
                       value="{{ values['course_name'] }}"
                       {% if delete_mode %}disabled{% endif %}>
            </label>
        </p>

        <p>
            <label>
                Description
                <textarea name="description" maxlength="200"
                          rows="4"
                          {% if delete_mode %}disabled{% endif %}
                >{{ values['description'] }}</textarea>
            </label>
        </p>

        <p>
            <label>
                <input name="active" type="checkbox" value="1"
                       {% if values['active'] %}checked{% endif %}
                       {% if delete_mode %}disabled{% endif %}>
                Active
            </label>
        </p>

        {% if delete_mode %}
            <button type="submit" name="action" value="delete"
                    formnovalidate>
                Confirm delete
            </button>
        {% else %}
            <button type="submit" name="action" value="update">
                Update
            </button>
        {% endif %}

        <button type="submit" name="action" value="cancel"
                formnovalidate>
            Cancel
        </button>
    </form>
</body>
</html>
