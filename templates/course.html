<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add course</title>
</head>
<body>
    <h1>Add course</h1>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('add_course') }}">
        <p>
            <label for="course_code">Course code</label>
            <input
                id="course_code"
                name="course_code"
                type="number"
                min="1000"
                max="9999"
                step="1"
                value="{{ values['course_code'] }}"
                required
            >
        </p>

        <p>
            <label for="course_name">Name</label>
            <input
                id="course_name"
                name="course_name"
                type="text"
                value="{{ values['course_name'] }}"
                required
            >
        </p>

        <p>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                maxlength="200"
                rows="4"
            >{{ values['description'] }}</textarea>
        </p>

        <p>
            <label>
                <input
                    type="checkbox"
                    name="active"
                    value="1"
                    {% if values['active'] %}checked{% endif %}
                >
                Active
            </label>
        </p>

        <button type="submit" name="action" value="update">
            Update
        </button>

        <button
            type="submit"
            name="action"
            value="cancel"
            formnovalidate
        >
            Cancel
        </button>
    </form>
</body>
</html>
